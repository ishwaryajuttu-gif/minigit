name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minigit and pytest
        run: python -m pip install ".[test]"
      - name: Run tests
        run: python -m pytest -v
      - name: Check the installed minigit command
        shell: bash
        run: |
          set -e
          cd "$(mktemp -d)"
          minigit --help | grep -q "^Commands:"
          python -m minigit_pkg --help | grep -q "^Commands:"
          minigit init
          printf 'hello world\n' > file.txt
          minigit add file.txt
          test "$(cut -d' ' -f2 .minigit/index)" = "$(git hash-object --no-filters file.txt)"
          minigit config user.name "CI Bot"
          minigit commit -m "first commit"
          minigit log | grep -q "first commit"
          minigit log | grep -q "^Author: CI Bot <>$"
          minigit log | grep -q "^Date:   "
          if minigit commit -m "no changes"; then exit 1; fi
          first="$(cat .minigit/HEAD)"
          printf 'changed\n' > file.txt
          minigit add file.txt
          minigit commit -m "second commit"
          rm file.txt
          minigit checkout "${first:0:7}" file.txt
          test "$(cat file.txt)" = "hello world"
