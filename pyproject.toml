[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minigit"
version = "1.1.0"
description = "A from-scratch reimplementation of Git's core storage engine: init, add, commit, log and checkout"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ishwarya J S" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
minigit = "minigit_pkg.cli:main"

[project.urls]
Homepage = "https://github.com/ishwaryajuttu-gif/minigit"

[tool.setuptools]
packages = ["minigit_pkg"]
